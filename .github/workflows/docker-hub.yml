name: Docker build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号，例如 v1.0.0"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ inputs.version || 'latest' }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
