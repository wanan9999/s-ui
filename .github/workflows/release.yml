name: Linux 构建与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eu
          (cd frontend && npm ci && npm run build)
          mkdir -p web/html s-ui
          cp -R frontend/dist/. web/html/
          . ./build-tags.sh
          go build -trimpath -buildvcs=false -tags "$(tags_for release)" -ldflags "$(ldflags_for release)" -o s-ui/sui .
          curl -fL --retry 3 "https://github.com/SagerNet/cronet-go/releases/latest/download/libcronet-linux-${GOARCH}.so" -o s-ui/libcronet.so
          cp s-ui.sh s-ui.service LICENSE README.md s-ui/
          chmod +x s-ui/sui s-ui/s-ui.sh
          tar czf "s-ui-linux-${GOARCH}.tar.gz" s-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s-ui-linux-${{ matrix.arch }}
          path: s-ui-linux-*.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: s-ui-linux-*
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: wanan9999/s-ui
        run: |
          sha256sum s-ui-linux-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" s-ui-linux-*.tar.gz SHA256SUMS --generate-notes
