name: Linux 构建与发布
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像版本号，例如 v1.0.0"
        required: true
        type: string
        default: "v1.0.0"
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: 设置构建版本
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: printf '%s\n' "${RELEASE_TAG#v}" > config/version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eu
          (cd frontend && npm ci && npm run build)
          mkdir -p web/html s-ui
          cp -R frontend/dist/. web/html/
          . ./build-tags.sh
          go build -trimpath -buildvcs=false -tags "$(tags_for release)" -ldflags "$(ldflags_for release)" -o s-ui/sui .
          curl -fL --retry 3 "https://github.com/SagerNet/cronet-go/releases/latest/download/libcronet-linux-${GOARCH}.so" -o s-ui/libcronet.so
          cp s-ui.sh s-ui.service LICENSE README.md s-ui/
          chmod +x s-ui/sui s-ui/s-ui.sh
          tar czf "s-ui-linux-${GOARCH}.tar.gz" s-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s-ui-linux-${{ matrix.arch }}
          path: s-ui-linux-*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: s-ui-linux-*
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha256sum s-ui-linux-*.tar.gz > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" s-ui-linux-*.tar.gz SHA256SUMS --clobber
