name: Test

# No push trigger: release.yml calls this as its gate, so a push would otherwise
# run the suite twice.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Check formatting
        run: |
          set -e
          unformatted=$(gofmt -l . | grep -v '^frontend/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: |
          . ./build-tags.sh
          CGO_ENABLED=0 go vet -tags "$(tags_for test)" ./...

      # A list pasted back into a workflow or Dockerfile compiles fine and then
      # drifts in silence. with_qui[c] so the pattern misses its own line.
      - name: No hardcoded build tags
        run: |
          set -e
          hits=$(grep -rn 'with_qui[c]' \
                   --include='*.yml' --include='*.yaml' \
                   --include='Dockerfile*' --include='*.sh' \
                   --exclude-dir=node_modules --exclude-dir=.git . \
                 | grep -v 'build-tags\.sh:' || true)
          if [ -n "$hits" ]; then
            echo "Build tags belong in build-tags.sh, not inline:" >&2
            echo "$hits" >&2
            exit 1
          fi

      # Tests do not load the optional Naive dynamic library.
      - name: Test
        run: |
          set -e
          . ./build-tags.sh
          TAGS=$(tags_for test)
          CGO_ENABLED=0 go test -tags "$TAGS" ./...

      # Scoped to the packages that are clean today, so this fails on a race we
      # introduce rather than the known upstream one in route.NetworkManager.
      - name: Test with race detector
        run: |
          set -e
          . ./build-tags.sh
          TAGS=$(tags_for test)
          go test -race -short -tags "$TAGS" ./api/... ./service/... ./sub/... ./database/... ./util/... ./logger/... ./network/... ./core/protocol/l2tp/...
          go test -race -tags "$TAGS" ./core -run '^Test(SessionTracker|RetiredPolicy|PolicyConcurrent|PolicyInvalidation|PolicyUDP)'

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: 前端检查
        working-directory: frontend
        run: npm ci && npm run lint && npm test && npm run build

      - name: L2TP 完整链路（隔离网络）
        run: |
          set -eu
          . ./build-tags.sh
          CGO_ENABLED=0 go test -c -tags "$(tags_for test)" -o /tmp/sui-core.test ./core
          sudo modprobe tun
          sudo unshare --net sh -c 'ip link set lo up; SUI_L2TP_INTEGRATION=1 /tmp/sui-core.test -test.run ^TestL2TPFullPipeline$ -test.v -test.timeout 3m'
