name: 发布 Linux 镜像
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '同时发布 GHCR 镜像'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/wanan9999/s-ui
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - name: 构建并加载测试镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sui:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验证容器启动和数据库
        run: |
          set -eu
          docker run --rm --entrypoint /app/sui sui:test -v
          trap 'docker logs sui-smoke; docker rm -f sui-smoke' EXIT
          docker run -d --name sui-smoke sui:test
          for startup in 1 2; do
            ready=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' sui-smoke)" != true ]; then
                docker inspect -f '{{json .State}}' sui-smoke
                exit 1
              fi
              if docker exec sui-smoke ./sui healthcheck; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then exit 1; fi
            if [ "$startup" = 1 ]; then docker restart sui-smoke; fi
          done
      - name: 发布双架构镜像
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
